name: api CI

on:
  pull_request:
    branches: [develop, main]

# Mínimo privilegio: `pull-requests` solo lo usa paths-filter para ver el diff.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/api-ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: score
          POSTGRES_PASSWORD: score
          POSTGRES_DB: score_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U score"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://score:score@localhost:5432/score_test?schema=public
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      JWT_SECRET: ci-secret-panel-de-al-menos-32-caracteres
      JWT_EXPIRES_IN: 1d
      ACCESS_LINK_JWT_SECRET: ci-secret-enlace-de-al-menos-32-caracteres
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm prisma migrate deploy
      - run: pnpm test
      - run: pnpm test:e2e
