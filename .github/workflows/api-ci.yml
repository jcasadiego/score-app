name: api CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/api-ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: score
          POSTGRES_PASSWORD: score
          POSTGRES_DB: score_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U score"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://score:score@localhost:5432/score_test?schema=public
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      JWT_SECRET: ci-secret-panel-de-al-menos-32-caracteres
      JWT_EXPIRACION: 1d
      ENLACE_JWT_SECRET: ci-secret-enlace-de-al-menos-32-caracteres
      ENLACE_JWT_EXPIRACION: 24h
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # No bloqueante: Prisma empaqueta drivers de otros motores (ej.
      # mysql2) que este proyecto no usa (solo Postgres vía @prisma/adapter-pg)
      # y que hoy arrastran CVEs sin parche disponible en pnpm. Se deja
      # visible en el log del PR sin frenar el merge por código que nunca
      # se ejecuta.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm prisma migrate deploy
      - run: pnpm test
      - run: pnpm test:e2e
