name: api CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: score
          POSTGRES_PASSWORD: score
          POSTGRES_DB: score_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U score"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://score:score@localhost:5432/score_test?schema=public
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      JWT_SECRET: ci-secret-panel
      JWT_EXPIRACION: 1d
      ENLACE_JWT_SECRET: ci-secret-enlace
      ENLACE_JWT_EXPIRACION: 24h
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm prisma migrate deploy
      - run: pnpm test
      - run: pnpm test:e2e
