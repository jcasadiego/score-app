name: diagnostico CI

on:
  pull_request:
    branches: [develop, main]

# Mínimo privilegio: `pull-requests` solo lo usa paths-filter para ver el diff.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      diagnostico: ${{ steps.filter.outputs.diagnostico }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            diagnostico:
              - 'apps/diagnostico/**'
              - '.github/workflows/diagnostico-ci.yml'

  diagnostico:
    needs: changes
    if: needs.changes.outputs.diagnostico == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/diagnostico
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/diagnostico/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm build
