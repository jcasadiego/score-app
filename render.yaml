# Blueprint de Render para el ambiente de QA de score-app (PF-68).
#
# Todo en instancias gratuitas, región Virginia (docs/infra/
# investigacion-despliegue.md, secciones 1 y 9). PROD no se define aquí: va en
# el workspace del cliente, con su propio despliegue (PF-74, PF-75).
#
# Ningún secreto vive en este archivo. Las variables con `sync: false` se
# cargan a mano en el panel de Render al crear el Blueprint; las marcadas con
# `generateValue` las genera Render.
#
# El despliegue automático queda apagado: lo decide GitHub Actions con el
# deploy hook de cada servicio (PF-71). Hasta entonces, se despliega a mano
# desde el panel de Render.

databases:
  - name: score-qa-db
    plan: free
    region: virginia
    databaseName: score
    user: score
    # Igual que local y CI (postgres:16-alpine).
    postgresMajorVersion: "16"
    # Sin acceso externo: solo la red privada de Render.
    ipAllowList: []

services:
  - type: web
    name: score-api-qa
    runtime: node
    plan: free
    region: virginia
    branch: develop
    rootDir: api
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # Migra, siembra (solo con APP_ENV=qa) y levanta la API. Ver el script.
    startCommand: sh scripts/start-qa.sh
    healthCheckPath: /health
    autoDeployTrigger: "off"
    # Da tiempo a terminar una llamada de IA en curso (AI_TIMEOUT_MS = 60 s).
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: qa
      # URL interna de la base + `?sslmode=require&uselibpqcompat=true`.
      # Sin `uselibpqcompat`, `pg` trata `require` como `verify-full` y
      # rechaza el certificado autofirmado de la red interna. Se carga a mano
      # (no `fromDatabase`) porque la URL de Render no trae el `sslmode`.
      - key: DATABASE_URL
        sync: false
      # Se mide en QA (PF-69); la API no arranca en producción sin ella.
      - key: TRUST_PROXY_HOPS
        sync: false
      # https://<diagnóstico de QA>,https://<sitio de QA>
      - key: CORS_ORIGINS
        sync: false
      - key: PANEL_URL
        sync: false
      - key: DIAGNOSTIC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_LINK_JWT_SECRET
        generateValue: true
      # 32 bytes en base64: `openssl rand -base64 32`.
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: PANEL_API_SECRET
        generateValue: true
      - key: DIAGNOSTIC_API_SECRET
        generateValue: true
      - key: MAIL_DRIVER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SCORING_ENGINE_DRIVER
        value: stub
      - key: AI_PROVIDER
        value: stub
      # Primer Aprobador que crea la siembra. Si ya existe, no se toca su
      # contraseña: cambiarla en el panel tras el primer ingreso.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: score-panel-qa
    runtime: node
    plan: free
    region: virginia
    branch: develop
    rootDir: apps/panel
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL pública de la API (las instancias gratuitas no reciben tráfico
      # por la red privada). Se usa en el build: cambiarla exige recompilar.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: PANEL_API_SECRET
        fromService:
          type: web
          name: score-api-qa
          envVarKey: PANEL_API_SECRET

  - type: web
    name: score-diagnostico-qa
    runtime: node
    plan: free
    region: virginia
    branch: develop
    rootDir: apps/diagnostico
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: DIAGNOSTIC_API_SECRET
        fromService:
          type: web
          name: score-api-qa
          envVarKey: DIAGNOSTIC_API_SECRET
